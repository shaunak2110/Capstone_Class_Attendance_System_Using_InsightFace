# ============================================================
# Face Recognition Evaluation Pipeline — Experiment Config
# ============================================================
# All paths are relative to backend/evaluation/
# Run: python run_experiments.py  (from backend/evaluation/)
# ============================================================

# Path to the raw dataset directory.
# Each sub-folder is treated as one identity (folder name = label).
# Structure: dataset/raw/<identity>/<image1.jpg> ...
#
# Real dataset (4 identities, 335 images total):
#   person_1_sudhanshu  — 75 images
#   person_2_shaunak    — 50 images
#   person_3_srishti    — 106 images
#   person_4_ashlesha   — 104 images
dataset_path: dataset/raw

# Fraction of images per identity used for the gallery (training split).
# The remaining fraction becomes the probe (test split).
# Must be in (0, 1). Default: 0.70 (70% gallery, 30% probe).
gallery_ratio: 0.70

# Integer seed for reproducible shuffling and splitting.
# Multi-run experiments use seed + run_index for each run.
random_seed: 42

# Resize all images to [width, height] before detection/recognition.
image_size: [640, 640]

# Detectors to enable. Each must have a corresponding wrapper in detection/.
# Available: insightface, haarcascade, retinaface
# Optional:  yolo (uncomment if YOLO model file is present)
detectors:
  - insightface
  - haarcascade
  - retinaface
  # - yolo

# Recognizers to enable. Each must have a corresponding wrapper in recognition/.
# Available: insightface, lbph, dlib
recognizers:
  - insightface
  - lbph
  - dlib

# Similarity threshold for embedding-based recognizers (insightface, dlib).
# Probe embeddings with best-match distance > threshold are rejected.
# Also used as the fixed-threshold baseline in threshold calibration (Req 15).
#
# CALIBRATED VALUE: ArcFace normalised cosine similarity for genuine pairs
# on this dataset clusters around 0.50–0.69 (mean=0.57). Threshold=0.85
# was too strict — it rejected all genuine matches.
# At threshold=0.50, accuracy=78% (closed-set, no FAR/FRR split needed).
# For open-set evaluation, use 0.50 to balance FAR/FRR.
similarity_threshold: 0.50

# Root directory for all output: logs, plots, reports.
output_dir: results/

# Open-set evaluation: fraction of identities withheld from the gallery entirely.
# Their probe images are treated as "unknown" and should be rejected.
# 0.0 = closed-set evaluation (default).
# Example: 0.2 withholds 20% of identities as unknown probes.
open_set_ratio: 0.0

# Number of times each experiment is repeated with a different random split.
# 1 = single run (default).
# >1 enables statistical evaluation: mean ± std reported across runs.
num_runs: 1
